async function mountWidget(){
  widgetReady = false;

    await loadToss();

    await widgets.setAmount({currency:"KRW", value: pay()});

      const d = await api("order/confirm", {paymentKey:q.get("paymentKey"), orderId:q.get("orderId"), amount:Number(q.get("amount"))});
      DONE = d.order; history.replaceState(null,"","/order?done="+encodeURIComponent(d.order.id));
      try{ sessionStorage.removeItem("wf_order"); }catch(e){}
      S = init(); renderDone();
    }catch(e){ renderFail(e.message); }
    return;
  }
  if(q.get("pay")==="fail"){ renderFail(q.get("code")==="PAY_PROCESS_CANCELED" ? "결제를 취소했어요." : q.get("message")); return; }
  if(q.get("done")){
    try{ const d = await api("orders/mine?voter="+encodeURIComponent(voter)); const o=d.orders.find(x=>x.id===q.get("done")); if(o){ DONE=o; renderDone(); return; } }catch(e){}
    history.replaceState(null,"","/order");
  }
  // 궁합 페이지에서 "우리 버전으로 주문하기"로 온 경우: /order?a=ISTP&b=ENFP&rel=커플
  const a=q.get("a"), b=q.get("b"), rel=q.get("rel");
  if(a&&TYPES.includes(a.toUpperCase())) S.a=a.toUpperCase();
  if(b&&TYPES.includes(b.toUpperCase())) S.b=b.toUpperCase();
  if(rel&&RELS.some(r=>r[0]===rel)) S.rel=rel;
  if(q.get("pkg")&&CFG.products[q.get("pkg")]) S.pkg=q.get("pkg");
  if(a||b||rel){ S.step="home"; history.replaceState(null,"","/order"); }
  if(!["home","s1","s2","s3","s4","s5"].includes(S.step) || (S.step==="s3"&&!sp())) S.step="home";
  save(); render();
  load3D();
})();
</script>
</body>
</html>
