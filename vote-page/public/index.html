<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>만약에 신청소 · @woong.if</title>
<meta name="description" content="@woong.if '온 세상이 MBTI라면?' — 다음 편 투표, 우리 유형 응원, 유형별 한마디">
<meta property="og:title" content="만약에 신청소 · @woong.if">
<meta property="og:description" content="다음 편 투표하고, 우리 유형 응원하고, 다른 유형에게 한마디">
<meta property="og:type" content="website">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#bfe0f4">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#1a1a1a;--sky:#bfe0f4;--bg:#f4f9fc;--yellow:#ffd84d;--red:#ff3b5c;--sub:#66717a;--mute:#8a949c;--line:#eef3f6;--nav:84px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#dfeef7;color:var(--ink);font-family:Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none !important}
.hs{scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom));box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.app.with-composer{padding-bottom:calc(var(--nav) + 150px + env(safe-area-inset-bottom))}

/* 헤더 */
.hd{background:var(--sky);padding:calc(6px + env(safe-area-inset-top)) 20px 18px;border-bottom:2px solid var(--ink)}
.hd.round{border-radius:0 0 32px 32px;padding-bottom:22px}
.brand{display:flex;align-items:center;justify-content:space-between;height:44px;gap:8px}
.brand .nm{display:flex;align-items:baseline;gap:6px}
.brand .nm b{font-size:18px;font-weight:900}
.brand .nm span{font-size:12px;font-weight:600;opacity:.6}
.pill{height:32px;padding:0 4px 0 11px;border-radius:16px;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap;max-width:62%}
.pill .nk{overflow:hidden;text-overflow:ellipsis}
.pill.plain{padding:0 14px;font-size:13px}
.tb{font-size:11px;font-weight:800;padding:2px 7px;border-radius:10px;flex:none}
.tag{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:800;transform:rotate(-2deg)}
.out{font-weight:900;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;line-height:1.15;letter-spacing:-.5px}
.ttl{margin-top:8px;font-size:30px}
.seg{display:flex;margin-top:14px;padding:3px;border-radius:14px;border:2px solid var(--ink);background:#fff}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--yellow);color:var(--ink);font-weight:900}

/* 공통 */
.pad{padding:20px 20px 0}
.h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h2 b{font-size:17px;font-weight:900}
.h2 span{font-size:12px;font-weight:700;color:var(--sub)}
.card{background:#fff;border:2px solid var(--ink);border-radius:20px}
.card.big{border-radius:22px;box-shadow:0 4px 0 var(--ink);padding:18px}
.muted{font-size:12px;color:var(--sub)}
.empty{padding:24px;text-align:center;font-size:13px;color:var(--sub);line-height:1.6}
.skel{height:120px;border-radius:22px;background:linear-gradient(90deg,#eaf2f7,#fff,#eaf2f7);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.ic{width:20px;height:20px;flex:none}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.45)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.pop svg{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}

/* 하트 버튼 */
.hbig{width:100%;height:52px;border-radius:16px;border:2px solid var(--ink);background:var(--red);color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.hbig path{fill:#fff;stroke:#fff}
.hbig.on{background:#ffe8ec;color:var(--red)}
.hbig.on path{fill:var(--red);stroke:var(--red)}
.hbig .n{opacity:.85}
.hsm{flex:none;display:flex;align-items:center;gap:4px;height:32px;padding:0 10px 0 8px;border-radius:16px;border:1.5px solid var(--ink);background:#fff;font-size:13px;font-weight:800}
.hsm svg{width:15px;height:15px}
.hsm path{fill:none;stroke:var(--ink)}
.hsm.on{border-color:var(--red);background:#ffe8ec;color:var(--red)}
.hsm.on path{fill:var(--red);stroke:var(--red)}

/* MBTI 탭 */
.prog{margin-top:10px;height:14px;border-radius:7px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--yellow);border-right:2px solid var(--ink)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toprow .r{font-size:12px;font-weight:700;color:var(--sub)}
.bigt{margin-top:14px;font-size:54px;font-weight:900;line-height:1;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;letter-spacing:-1px}
.subt{margin-top:10px;font-size:18px;font-weight:900;word-break:keep-all}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:20px}
.tile{position:relative;height:104px;border-radius:16px;border:2px solid var(--ink);overflow:hidden;text-decoration:none;color:var(--ink);display:block}
.tile .nm{padding:8px 8px 0;font-size:15px;font-weight:900}
.tile .st{display:inline-block;margin:6px 0 0 8px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--yellow);border:1.5px solid var(--ink)}
.tile .st.today{background:var(--red);color:#fff}
.tile .hb{position:absolute;left:6px;right:6px;bottom:6px;height:30px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;padding:0}
.tile .hb svg{width:13px;height:13px}
.tile .hb path{fill:none;stroke:var(--ink)}
.tile .hb.on{border-color:var(--red);background:#ffe8ec;color:var(--red)}
.tile .hb.on path{fill:var(--red);stroke:var(--red)}
.tile.done .stripe{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 5px,transparent 5px 10px)}
.tile.done img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.tile.done .ep{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--ink);color:#fff}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:14px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.play::after{content:"";border-left:8px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.tile.done .lb{position:absolute;left:6px;right:6px;bottom:6px;text-align:center;font-size:12px;font-weight:900;background:#fff;border-radius:8px;padding:2px 0}
.note{margin:10px 2px 0;font-size:12px;color:var(--sub)}

/* 폼 */
.form{margin-top:24px;padding:16px}
.form .t{font-size:16px;font-weight:900}
.form .lbl{font-size:13px;font-weight:800;margin:14px 0 8px}
.row{display:flex;gap:8px;align-items:center}
.sel{position:relative;flex:1}
.sel select{width:100%;height:46px;border-radius:12px;border:2px solid var(--ink);background:#fff;padding:0 12px;font-size:16px;font-weight:800;-webkit-appearance:none;appearance:none;outline:none}
.sel::after{content:"▼";position:absolute;right:12px;top:15px;font-size:11px;pointer-events:none}
.inp{width:100%;height:46px;border-radius:12px;border:2px solid var(--ink);padding:0 12px;font-size:16px;background:var(--bg);outline:none}
textarea.inp{height:76px;padding:10px 12px 18px;line-height:1.4;resize:none}
.cnt{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--mute)}
.btn{width:100%;height:52px;border-radius:16px;border:2px solid var(--ink);background:var(--yellow);font-size:16px;font-weight:900}
.btn:disabled{background:#e8edf0;color:var(--mute)}
.btn.sm{height:46px;font-size:14px;border-radius:14px}
.btn.shadow{height:58px;border-radius:18px;box-shadow:0 4px 0 var(--ink);font-size:17px}
.btn.shadow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.preview{margin-top:14px;border:2px dashed rgba(26,26,26,.3);border-radius:14px;background:#eaf5fc;padding:12px 14px}
.preview small{font-size:11px;font-weight:700;color:var(--sub)}
.preview div{font-size:16px;font-weight:900;margin-top:4px;word-break:keep-all}
.dupbox{margin-top:12px;background:#fff6cc;border:2px solid var(--ink);border-radius:14px;padding:12px 14px}
.dupbox b{font-size:14px;font-weight:900}
.chips{display:flex;gap:6px;overflow-x:auto;padding:18px 20px 0}
.chip{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1.5px solid rgba(26,26,26,.25);background:#fff;font-size:13px;font-weight:800}
.chip.on{background:var(--yellow);border:2px solid var(--ink)}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}

/* 목록 */
.list{margin:12px 20px 0;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1.5px solid var(--line)}
.li:last-child{border-bottom:0}
.li .n{width:16px;font-size:13px;font-weight:900;color:var(--sub);flex:none}
.li .bd{flex:1;min-width:0}
.li .tt{font-size:14px;font-weight:800;line-height:1.4;word-break:keep-all}
.li .mt{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--mute)}
.mini{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--line);color:#3b4650;white-space:nowrap}
.more{width:100%;height:46px;border:0;border-top:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:800}
.duo{display:flex;align-items:center;gap:8px;margin-top:14px}
.duo span{flex:1;height:60px;border-radius:16px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.duo i{font-style:normal;font-size:20px;font-weight:900}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:12px 20px 4px}
.th{flex:none;width:140px;text-decoration:none}
.th .im{position:relative;height:180px;border-radius:16px;border:2px solid var(--ink);background:repeating-linear-gradient(135deg,#dcedf8 0 6px,#bfe0f4 6px 12px);overflow:hidden}
.th .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.th .im .ep{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--ink);color:#fff;z-index:1}
.th .cap{font-size:13px;font-weight:800;margin-top:8px;line-height:1.35}
.dchips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 0}
.dchip{display:flex;align-items:center;gap:8px;min-height:38px;padding:6px 14px 6px 10px;border-radius:19px;border:2px solid var(--ink);background:#fff;font-size:13px;font-weight:800;text-decoration:none}
.dchip i{width:20px;height:20px;border-radius:10px;background:var(--yellow);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.dchip i::after{content:"";border-left:6px solid var(--ink);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}
.sec{padding:28px 20px 0;font-size:17px;font-weight:900}

/* 알림 카드 */
.notice{margin-top:10px;background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:14px 16px}
.notice .top{display:flex;align-items:center;justify-content:space-between}
.notice .top span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--red)}
.notice .top span::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--red)}
.notice .x{border:0;background:none;font-size:13px;font-weight:700;color:var(--mute);padding:4px}
.notice .bd{display:flex;gap:12px;align-items:center;margin-top:10px}
.notice .im{position:relative;width:56px;height:70px;flex:none;border-radius:12px;border:2px solid var(--ink);background:repeating-linear-gradient(135deg,#dcedf8 0 5px,#bfe0f4 5px 10px);overflow:hidden}
.notice .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.notice .im .play{width:24px;height:24px}
.notice .tt{font-size:16px;font-weight:900;line-height:1.35;word-break:keep-all}

/* 우리 유형 */
.hero{display:flex;gap:8px;margin-top:14px}
.hero .bd{flex:1;min-width:0}
.hero .t1{margin-top:12px;font-size:40px;-webkit-text-stroke:8px var(--ink);line-height:1.12;letter-spacing:-1px}
.hero p{margin:12px 0 0;font-size:14px;line-height:1.5;font-weight:500;color:#2a3a46}
.hero .art{width:116px;height:150px;flex:none;border-radius:20px;border:2px solid var(--ink);background:#fff url(/thumbs/ISFP.jpg) center 20%/cover}
.steps{display:flex;align-items:flex-start;justify-content:space-between;position:relative}
.steps::before{content:"";position:absolute;left:30px;right:30px;top:13px;height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px)}
.steps div{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px;position:relative}
.steps i{width:28px;height:28px;border-radius:14px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;font-style:normal}
.steps .on i{background:var(--yellow)}
.steps span{font-size:12px;font-weight:600;color:#55606a}
.steps .on span{font-weight:800;color:var(--ink)}
.bars{padding:8px;display:flex;flex-direction:column;gap:0}
.bar{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.bar.me{background:#fff3b8;outline:2px solid var(--ink)}
.bar .n{width:18px;font-size:12px;font-weight:900;color:var(--sub)}
.bar .t{width:40px;font-size:13px;font-weight:700}
.bar.me .t{font-weight:900}
.bar .tr{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;border-right:2px solid var(--ink);border-radius:8px;transition:width .4s}
.bar .v{width:48px;text-align:right;font-size:12px;font-weight:700;color:#3b4650}
.mini-seg{display:flex;padding:3px;border-radius:12px;border:2px solid var(--ink);background:#fff}
.mini-seg button{height:28px;padding:0 10px;border:0;border-radius:8px;font-size:12px;font-weight:800;background:transparent}
.mini-seg button.on{background:var(--yellow)}
.cta{display:flex;align-items:center;justify-content:space-between;background:var(--yellow);border:2px solid var(--ink);border-radius:18px;padding:16px 18px;width:100%;text-align:left}
.cta b{font-size:16px;font-weight:900;display:block}
.cta small{font-size:12px;color:#3b4650}
.cta span{font-size:22px;font-weight:900}

/* 한마디 */
.post{background:#fff;border:1.5px solid var(--ink);border-radius:18px;padding:14px 16px}
.post .hd2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.post .nk{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .ft{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap;flex:none}
.post p{margin:8px 0 10px;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.post .bt{display:flex;align-items:center;justify-content:space-between}
.post .bt .l{display:flex;align-items:center;gap:10px}
.post .lk{display:flex;align-items:center;gap:4px;height:30px;padding:0 10px 0 8px;border-radius:15px;border:1.5px solid rgba(255,59,92,.35);background:#fff;font-size:12px;font-weight:800;color:var(--red)}
.post .lk svg{width:15px;height:15px}
.post .lk path{fill:none;stroke:var(--red)}
.post .lk.on{background:#ffe8ec;border-color:var(--red)}
.post .lk.on path{fill:var(--red)}
.post .tm{font-size:12px;color:var(--mute)}
.post .ac{border:0;background:none;padding:4px;font-size:12px;font-weight:600;color:var(--mute)}
.post .ac.del{color:var(--red)}
.posts{padding:0 20px;display:flex;flex-direction:column;gap:10px}
.post .q{color:var(--red);font-weight:900}
.post .rb{display:flex;align-items:center;height:30px;padding:0 10px;border-radius:15px;border:1.5px solid rgba(26,26,26,.25);background:#fff;font-size:12px;font-weight:800}
.post .rb.on{border-color:var(--ink);background:var(--yellow)}
.replies{margin-top:12px;border-top:1.5px dashed rgba(26,26,26,.2);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.reply{background:var(--bg);border-radius:12px;padding:10px 12px}
.reply.self{background:#fff3b8;outline:2px solid var(--ink)}
.reply .rh{display:flex;align-items:center;gap:6px;font-size:12px}
.reply .rh .nk{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.reply .rh .ft{font-size:10px;padding:2px 6px}
.reply .rh .tm{margin-left:auto;flex:none}
.reply .rh .ac{flex:none}
.reply .rt{margin-top:4px;font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.rin{display:flex;gap:6px;margin-top:2px}
.rin .inp{height:42px;font-size:15px;flex:1;min-width:0}
.rin .go{width:60px;border-radius:12px;border:2px solid var(--ink);background:var(--yellow);font-size:13px;font-weight:900}
.bsort{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 8px}
.bsort span{font-size:12px;font-weight:600;color:var(--sub)}
.bsort div{display:flex;gap:12px}
.bsort button{border:0;background:none;padding:0;font-size:13px;font-weight:700;color:var(--mute)}
.bsort button.on{color:var(--ink)}
.bempty{margin:12px 20px 0;border:2px dashed rgba(26,26,26,.25);border-radius:22px;padding:32px 20px;text-align:center}
.bempty b{display:block;font-size:16px;font-weight:800}
.bempty small{display:block;margin-top:6px;font-size:13px;color:var(--sub)}
.composer{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--ink);padding:10px 16px 12px;z-index:9}
.composer .w{font-size:11px;color:var(--mute);margin:0 4px 8px}
.composer .row{align-items:stretch}
.composer .ta{flex:1;position:relative}
.composer textarea{width:100%;height:64px;border-radius:14px;border:2px solid var(--ink);padding:10px 12px 18px;font-size:15px;line-height:1.4;background:var(--bg);resize:none;outline:none}
.composer .go{width:72px;border-radius:14px;border:2px solid var(--ink);background:var(--yellow);font-size:14px;font-weight:900}
.composer .go:disabled{background:#e8edf0;color:var(--mute)}

/* 내 정보 */
.prof{display:flex;align-items:center;gap:14px}
.prof .av{width:60px;height:60px;border-radius:20px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex:none}
.prof b{font-size:19px;font-weight:900;display:block}
.prof small{font-size:12px;color:var(--sub)}
.two{display:flex;gap:8px;margin-top:14px}
.two button{flex:1;height:40px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:13px;font-weight:800}
.two button.y{background:var(--yellow)}
.mi{padding:12px 14px;border-bottom:1.5px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi .tp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{flex:none;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;border:2px solid var(--ink)}
.badge.done{background:var(--ink);color:#fff}
.badge.today{background:var(--red);color:#fff}
.badge.making{background:var(--yellow)}
.badge.open{background:var(--line);color:#3b4650;border-color:transparent}
.mi .rt{font-size:12px;font-weight:800;color:var(--mute)}

.mypost{background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:12px 14px}
.mypost .to{font-size:12px;font-weight:800;color:#55606a}

.mypost .ft button{border:0;background:none;padding:0;color:var(--red);font-weight:700;font-size:12px}

/* 하단 탭 */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(var(--nav) + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--ink);display:flex;gap:4px;padding:8px 10px env(safe-area-inset-bottom);z-index:10}

.nav button.on{border-color:var(--ink);background:var(--yellow);color:var(--ink);font-weight:900}

/* 시트 */
.dim{position:fixed;inset:0;background:rgba(18,32,44,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.dim.show{display:flex}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:30px 30px 0 0;border-top:2px solid var(--ink);padding:12px 24px calc(28px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-height:92vh;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#d5dbe0;margin:0 auto}
.sheet h2{margin:12px 0 0;text-align:center;font-size:24px;font-weight:900;letter-spacing:-.5px}
.sheet .d{margin:8px 0 0;text-align:center;font-size:14px;line-height:1.55;color:#55606a}
.kakao{margin-top:24px;width:100%;height:54px;border:0;border-radius:12px;background:#FEE500;color:rgba(0,0,0,.85);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.later{margin-top:8px;width:100%;height:48px;border:0;background:none;font-size:14px;font-weight:600;color:var(--sub)}
.fine{margin:4px 0 0;text-align:center;font-size:12px;color:var(--mute)}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tgrid button{height:46px;border-radius:14px;border:1.5px solid rgba(26,26,26,.2);background:#fff;font-size:15px;font-weight:800;transition:all .12s}
.tgrid button.on{border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.glabel{font-size:12px;font-weight:700;color:#55606a;margin:12px 0 6px}
.menu{position:fixed;z-index:31;top:calc(56px + env(safe-area-inset-top));right:max(16px,calc(50% - 224px));width:250px;background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:16px}
.menu .mrow{display:flex;justify-content:space-between;width:100%;padding:10px 0;font-size:14px;font-weight:600;border:0;background:none;text-align:left}
.menu .mrow span:last-child{color:var(--mute)}
.mdim{position:fixed;inset:0;z-index:30;background:rgba(18,32,44,.25)}

/* 주민 등록 화면 */
.setup{position:relative;z-index:25;background:var(--bg);min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
body.in-setup .app,body.in-setup .nav,body.in-setup .composer{display:none !important}
.setup .in{max-width:480px;margin:0 auto}
.setup .foot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;padding:14px 20px calc(20px + env(safe-area-inset-bottom));background:var(--bg);border-top:1.5px solid rgba(26,26,26,.1)}
.back{border:0;background:none;padding:0;font-size:14px;font-weight:700}

.toast{pointer-events:none;position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:12px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:32px;line-height:1.8}
footer.biz{text-align:left;margin-top:36px;padding:20px 20px 0;border-top:1.5px solid #dde7ee;font-size:11px;line-height:1.75;color:#66717a}
footer.biz nav{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}footer.biz nav a{color:#3b4650;font-weight:800;text-decoration:none}
.ostrip{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;border-radius:16px;border:2px solid var(--ink);background:#fff6cc;box-shadow:0 3px 0 var(--ink);text-decoration:none;color:var(--ink);font-size:14px}
.ostrip b{flex:1;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ostrip i{font-style:normal;font-weight:900}
.obanner{display:flex;gap:12px;align-items:stretch;margin-top:12px;padding:16px 14px 16px 16px;border-radius:22px;border:2px solid var(--ink);background:#fff6cc;box-shadow:0 4px 0 var(--ink);text-decoration:none;color:var(--ink)}
.obanner .nw{display:inline-block;background:var(--red);border:2px solid var(--ink);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:900;color:#fff;transform:rotate(-2deg)}
.obanner b{display:block;margin-top:8px;font-size:18px;font-weight:900;line-height:1.3;word-break:keep-all}
.obanner small{display:block;margin-top:6px;font-size:12px;font-weight:700;color:#3b4650;line-height:1.5}
.obanner .go{display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:38px;padding:0 14px;border-radius:19px;background:var(--ink);color:#fff;font-size:13px;font-weight:900}
.obanner .vid{flex:none;width:84px;border-radius:14px;border:2px solid var(--ink);background:repeating-linear-gradient(135deg,#dcedf8 0 6px,#bfe0f4 6px 12px);display:flex;align-items:center;justify-content:center}
.obanner .vid i{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.obanner .vid i::after{content:"";border-left:11px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.thw{flex:none;width:140px;display:flex;flex-direction:column}
.thw .ord{margin-top:6px;height:32px;border-radius:16px;border:2px solid var(--ink);background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;text-decoration:none;color:var(--ink)}
.ocard{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:14px 16px}
.ocard+.ocard{margin-top:10px}
.ocard .oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ocard .oid{font:600 11px ui-monospace,Menlo,monospace;color:var(--mute)}
.ocard .ot{margin-top:8px;font-size:15px;font-weight:900;word-break:keep-all}
.ocard .os{margin-top:3px;font-size:12px;font-weight:700;color:#55606a}
.otrack{display:flex;justify-content:space-between;margin:14px 6px 0;position:relative}

.otrack div{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#66717a;width:56px}
.otrack i{width:18px;height:18px;border-radius:9px;border:2px solid var(--ink);background:#fff}
.otrack .dn i{background:var(--ink)}.otrack .cu i{background:var(--yellow)}.otrack .cu{color:var(--ink);font-weight:900}
.ocard .of{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1.5px solid var(--line);font-size:12px;font-weight:700;color:#55606a}
.ocard .of button{border:none;background:none;padding:0;color:#d4163b;font-weight:900;text-decoration:underline;font-size:12px}
.ocard .dl{display:flex;align-items:center;justify-content:center;margin-top:12px;height:44px;border-radius:14px;border:2px solid var(--ink);background:var(--yellow);font-weight:900;font-size:14px;text-decoration:none;color:var(--ink)}
.ocard .scr{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f1ecff;border:2px solid #5b45b8;font-size:13px;font-weight:800}
.badge.o-paid{background:#fff}.badge.o-script{background:#ddd2ff}.badge.o-making{background:var(--yellow)}.badge.o-done{background:var(--ink);color:#fff}.badge.o-canceled{background:var(--line);color:#66717a;border-color:transparent}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="view"></div>
  <footer>릴스는 인스타그램 <a href="https://www.instagram.com/woong.if/" target="_blank" rel="noopener">@woong.if</a><br>문의 <a href="mailto:ddd12340@naver.com">ddd12340@naver.com</a></footer>
</div>
<div class="composer" id="composer" hidden></div>
<nav class="nav" id="nav">
  <button data-tab="vote">투표</button><button data-tab="town">우리 유형</button><button data-tab="board">게시판</button><button data-tab="me">내 정보</button>
</nav>
<div class="dim" id="dim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="menuWrap"></div>
<div class="setup" id="setup" hidden></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const HEART = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 19 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z" stroke-width="2"/></svg>';
const KAKAO = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 4C6.9 4 3 7.2 3 11.1c0 2.5 1.6 4.7 4.1 6l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.6.1 1.2.1 1.9.1 5.1 0 9-3.2 9-7.1S17.1 4 12 4z" fill="#000"/></svg>';
const REELS = "https://www.instagram.com/woong.if/reels/";
const TYPES = ["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP","ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];
const G = {NT:{name:"분석가",c:"#ddd2ff",ink:"#5b45b8"},NF:{name:"외교관",c:"#c9f0dc",ink:"#23855a"},SJ:{name:"관리자",c:"#d3e6f7",ink:"#2f6ea3"},SP:{name:"탐험가",c:"#ffeab0",ink:"#94690a"}};
const grp = (t) => t[1]==="N" ? (t[2]==="T"?"NT":"NF") : (t[3]==="J"?"SJ":"SP");
const gc = (t) => G[grp(t)];
const fmt = (n) => Number(n||0).toLocaleString("ko-KR");
const josa = (w,a,b) => { const c=String(w).trim().slice(-1).charCodeAt(0); return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b; };
const tb = (t) => `<span class="tb" style="background:${gc(t).c};color:${gc(t).ink}">${t}</span>`;
const ago = (t) => { const m=Math.floor((Date.now()-t)/60000); return m<1?"방금":m<60?m+"분 전":m<1440?Math.floor(m/60)+"시간 전":Math.floor(m/1440)+"일 전"; };

let voter;
try { voter = localStorage.getItem("wf_voter"); if(!voter){ voter = crypto.randomUUID(); localStorage.setItem("wf_voter", voter); } }
catch { voter = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)+Date.now()); }
const V = encodeURIComponent(voter);

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
async function api(path, body){
  const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), 10000);
  try{
    const r = await fetch("/api/"+path, {method: body?"POST":"GET", signal:ctrl.signal, credentials:"same-origin", headers:{"content-type":"application/json"}, body: body?JSON.stringify({...body, voter}):undefined});
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ const e = new Error(d.error || "잠시 후 다시 시도해 주세요"); e.status = r.status; throw e; }
    return d;
  }catch(e){ if(e.name==="AbortError") throw new Error("연결이 느려요. 다시 시도해 주세요"); throw e; }
  finally{ clearTimeout(tm); }
}
const popEl = (sel) => { const el=$(sel); if(el){ el.classList.add("pop"); setTimeout(()=>el.classList.remove("pop"),460); } };

// ---------- 상태 ----------
const S = { tab:"vote", vtab:"mbti", town:null, mbti:null, pair:null, sit:null, board:{type:null, sort:"top", data:null}, me:null, picked:[],
  cf:"all", sf:"all", cMore:false, form:{rel:"커플", a:"ISFJ", b:"ENTP", custom:""}, sform:{type:"INFP", text:""}, sc:{type:"INFP", text:""}, townSort:"res" };
const ORDER_OPEN = false;   // 맞춤 영상 주문 입구(배너·우리 버전 주문·푸터 링크). 다 다듬으면 true로
const myType = () => S.town?.me?.type || null;

// ---------- 헤더 조각 ----------
function brandHTML(){
  const me = S.town?.me;
  let right;
  if(me) right = `<button class="pill" id="pf"><span class="nk">${esc(me.nick)}</span>${tb(me.type)}</button>`;
  else if(S.town?.kakao && !S.town?.loggedIn) right = `<button class="pill plain" id="pf">로그인</button>`;
  else right = `<button class="pill plain" id="pf">주민 등록</button>`;
  return `<div class="brand"><div class="nm"><b>웅이프</b><span>@woong.if</span></div>${right}</div>`;
}
function bindBrand(){ const b=$("#pf"); if(b) b.onclick = ()=> S.town?.me ? openMenu() : startJoin(); }

// ---------- 라우팅 ----------
function setTab(tab, opts={}){
  S.tab = tab;
  $$("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const h = tab==="vote" ? (S.vtab==="mbti" ? "" : "#"+S.vtab) : "#"+tab;
  try{ history.replaceState(null, "", location.pathname + h); }catch{}
  if(!opts.keepScroll) window.scrollTo(0,0);
  render();
}
$$("#nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){
  $("#composer").hidden = S.tab!=="board";
  $("#app").classList.toggle("with-composer", S.tab==="board");
  if(S.tab==="vote") renderVote();
  else if(S.tab==="town") renderTown();
  else if(S.tab==="board") renderBoard();
  else renderMe();
}

// ---------- 하트 (로그인 없이, 같은 항목 하루 1번) ----------
let likeBusy=false;
async function like(kind, body, after){
  if(likeBusy) return; likeBusy=true;
  try{ const r = await api(kind+"/like", body); if(!r.liked) toast("오늘 하트를 취소했어요"); await after(r); return r; }
  catch(e){ toast(e.message); }
  finally{ likeBusy=false; }
}

// ================= 투표 =================
function renderVote(){
  const v = $("#view");
  const segs = [["mbti","MBTI"],["pair","궁합"],["sit","상황"]];
  v.innerHTML = `<header class="hd">${brandHTML()}<div id="notice"></div>
    <div style="margin-top:12px"><span class="tag">만약에 신청소</span></div>
    <div class="out ttl">다음 편, 뭐 볼래?</div>
    ${ORDER_OPEN?`<a class="ostrip" href="/order${myType()?`?a=${myType()}`:""}"><span>🎬</span><b>우리 둘 궁합도 영상으로 받아 볼래?</b><i>→</i></a>`:""}
    <div class="seg">${segs.map(([k,l])=>`<button data-v="${k}" class="${S.vtab===k?"on":""}">${l}</button>`).join("")}</div></header>
    <div id="vbody"><div class="pad"><div class="skel"></div></div></div>`;
  bindBrand(); renderNotice();
  $$(".seg button", v).forEach(b=>b.onclick=()=>{ S.vtab=b.dataset.v; setTab("vote",{keepScroll:true}); });
  if(S.vtab==="mbti") S.mbti ? drawMbti() : loadMbti();
  else if(S.vtab==="pair") S.pair ? drawPair() : loadPair();
  else S.sit ? drawSit() : loadSit();
}

// --- 알림: 내가 하트 누른 게 제작 중·오늘 공개·나옴
let seenPicked = {}; try{ seenPicked = JSON.parse(localStorage.getItem("wf_picked")||"{}"); }catch{}
const pairTitle = (a,b,rel) => rel==="커플" ? `${a}(남자) × ${b}(여자) 커플이라면?` : `${a} × ${b} ${rel}${josa(rel,"이라면?","라면?")}`;
const sitTitle = (t,text) => `온 세상이 ${t}인데 ${text||"○○한다면"}?`;
function itemTitle(p){ return p.kind==="mbti" ? `온 세상이 ${p.type}라면?` : p.kind==="pair" ? pairTitle(p.a,p.b,p.rel) : sitTitle(p.type,p.text); }
function itemThumb(p){ return p.kind==="mbti" ? `/thumbs/${p.type}.jpg` : p.kind==="pair" ? `/thumbs/p_${p.a}_${p.b}.jpg` : ""; }
async function loadPicked(){ try{ const {picked} = await api("mine?voter="+V); S.picked = picked; renderNotice(); }catch{} }
function renderNotice(){
  const box = $("#notice"); if(!box) return;
  const order = {done:0, today:1, making:2};
  const p = S.picked.filter(x=>seenPicked[x.kind+"|"+x.key]!==x.status).sort((a,b)=>order[a.status]-order[b.status])[0];
  if(!p){ box.innerHTML=""; return; }
  const what = {mbti:"유형", pair:"궁합", situation:"상황"}[p.kind];
  const msg = p.status==="done" ? `하트 누른 ${what}이 영상으로 나왔어요!` : p.status==="today" ? `하트 누른 ${what}이 오늘 공개돼요!` : `하트 누른 ${what}이 제작에 들어갔어요!`;
  const th = itemThumb(p);
  box.innerHTML = `<div class="notice"><div class="top"><span>${msg}</span><button class="x">닫기</button></div>
    <div class="bd"><div class="im">${th?`<img src="${th}" alt="" onerror="this.remove()">`:""}<span class="play"></span></div>
    <div style="flex:1;min-width:0"><div class="tt">${esc(itemTitle(p))}</div><div class="muted" style="margin-top:2px">${p.status==="making"?"조금만 기다려 주세요":"@woong.if 릴스에서 볼 수 있어요"}</div></div></div>
    ${p.status!=="making"?`<a class="btn sm" style="margin-top:12px;display:flex;align-items:center;justify-content:center;text-decoration:none" href="${esc(p.link||REELS)}" target="_blank" rel="noopener">릴스 보러 가기</a>`:""}</div>`;
  const close = ()=>{ seenPicked[p.kind+"|"+p.key]=p.status; try{ localStorage.setItem("wf_picked", JSON.stringify(seenPicked)); }catch{} renderNotice(); };
  $(".x", box).onclick = close; const a=$("a", box); if(a) a.addEventListener("click", close);
}

// --- MBTI
async function loadMbti(){
  try{ S.mbti = await api("mbti?voter="+V); S.mbti.order = [...S.mbti.types].sort((a,b)=>b.votes-a.votes).map(t=>t.type); if(S.tab==="vote"&&S.vtab==="mbti") drawMbti(); }
  catch(e){ $("#vbody").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}
function drawMbti(){
  const m = S.mbti, by = Object.fromEntries(m.types.map(t=>[t.type,t]));
  const done = m.types.filter(t=>t.status==="done");
  const open = m.types.filter(t=>t.status!=="done").sort((a,b)=>m.order.indexOf(a.type)-m.order.indexOf(b.type));
  const top = open[0], second = open[1], liked = (t)=>m.todayLikes.includes(t);
  const topHTML = top && top.votes>0 ? `<div class="card big" style="margin-top:16px">
      <div class="toprow"><span class="tag">${top.status==="making"?"제작 중":top.status==="today"?"오늘 공개":"지금 1위"}</span>
      <span class="r">${second && top.status==="open" ? (second.votes===top.votes ? `2위 ${second.type}와 동점` : `2위 ${second.type}와 ${top.votes-second.votes}표 차이`) : ""}</span></div>
      <div class="bigt" style="color:${gc(top.type).c}">${top.type}</div>
      <div class="subt">온 세상이 ${top.type}라면?</div>

    : `<div class="bempty"><b>${e1}</b><small>${e2}</small></div>`;

let draft = "";
function drawComposer(){
  const t = S.board.type, c = $("#composer"), C = CATS[S.board.cat];
  c.innerHTML = `<div class="w">비하·욕설은 신고 3번이면 숨겨져요 · 내 닉네임과 MBTI가 같이 보여요</div>
    <div class="row"><div class="ta"><textarea id="bText" maxlength="100" placeholder="${esc(C.ph(t))}">${esc(draft)}</textarea><span class="cnt" id="bLen">${draft.length}/100</span></div>
    <button class="go" id="bGo" ${draft.trim().length<4?"disabled":""}>${S.board.cat==="ask"?"질문하기":"남기기"}</button></div>`;
  $("#bText").oninput = (e)=>{ draft=e.target.value; $("#bLen").textContent=draft.length+"/100"; $("#bGo").disabled = draft.trim().length<4; };
  $("#bText").onfocus = ()=>{ if(!S.town?.me){ $("#bText").blur(); startJoin(); } };
  $("#bGo").onclick = async ()=>{
    if(!S.town?.me){ startJoin(); return; }
    $("#bGo").disabled = true;
    try{
      await api("board", {type:S.board.type, cat:S.board.cat, text:draft.trim()});
      draft=""; recent=null; S.me=null; toast(S.board.cat==="ask"?"질문을 올렸어요! 답글을 기다려 봐요":"남겼어요! 고마워요");
      S.board.sort="new"; S.board.data=null; renderBoard();
    }catch(e){ toast(e.message); $("#bGo").disabled=false; if(e.status===401) startJoin(); }
  };
}
let postBusy=false;
async function postAct(id, act){
  if(postBusy) return; postBusy=true;
  try{
    const r = await api(`board/${id}/${act}`, {});
    if(act==="heart"){
      const p = S.board.data?.posts.find(x=>x.id===id);
      if(p){ p.hearts=r.hearts; p.liked=r.liked; drawPosts(); if(r.liked) popEl(`[data-like="${id}"]`); }
    } else {
      toast(act==="report" ? "신고했어요. 고마워요" : "지웠어요"); recent=null; S.me=null;
      if(S.tab==="board"){ S.board.data=null; renderBoard(); } else renderMe();
    }
  }catch(e){ toast(e.message); }
  finally{ postBusy=false; }
}

// ================= 내 정보 =================
async function renderMe(){
  const v = $("#view");
  if(!S.town) await loadTown();
  const me = S.town?.me;
  v.innerHTML = `<header class="hd round"><div class="brand"><div class="nm"><b>내 정보</b></div></div>
    ${me ? `<div class="card big" style="margin-top:8px"><div class="prof"><div class="av" style="background:${gc(me.type).c}">${me.type}</div>
      <div style="min-width:0"><b>${esc(me.nick)}</b><small>${gc(me.type).name} 동네 주민 · ${S.town.loggedIn?"카카오 로그인":"이 기기로 등록"}</small></div></div>
      <div class="two"><button id="chgNick">닉네임 바꾸기</button><button class="y" id="chgType">MBTI 바꾸기</button></div></div>`
    : `<div class="card big" style="margin-top:8px"><b style="font-size:17px;font-weight:900">아직 주민이 아니에요</b>
      <p class="muted" style="margin:6px 0 14px;font-size:13px">내 MBTI로 등록하면 우리 유형 응원과 한마디를 할 수 있어요</p>
      <button class="btn" id="join">${S.town?.kakao && !S.town?.loggedIn ? "로그인하고 주민 등록하기" : "내 유형 주민 등록하기"}</button></div>`}</header>
    <div class="pad" style="padding-top:24px" id="myOrdersWrap" hidden><div class="h2"><b>내 주문</b><a href="/order" style="font-size:12px;font-weight:800">새로 주문하기</a></div><div id="myOrders" style="margin-top:12px"></div></div>
    <div class="pad" style="padding-top:24px"><div class="h2"><b>내가 하트 누른 것</b><span style="font-weight:400">하루 1번 · 매일 누적</span></div><div id="myLikes" style="margin-top:12px"><div class="skel"></div></div></div>
    ${me ? `<div class="pad" style="padding-top:24px"><div class="h2"><b>내가 쓴 글</b><span id="myN"></span></div><div id="myPosts" style="display:flex;flex-direction:column;gap:8px;margin-top:12px"></div></div>` : ""}
    ${S.town?.loggedIn ? `<div class="pad" style="padding-top:24px"><button class="logout" id="logout">로그아웃</button></div>` : ""}`;
  if(me){ $("#chgNick").onclick = editNick; $("#chgType").onclick = ()=>openSetup({changeOnly:true}); }
  else $("#join").onclick = startJoin;
  const lo=$("#logout"); if(lo) lo.onclick = logout;
  loadOrders();
  try{ if(!S.me) S.me = await api("me?voter="+V); }catch(e){ $("#myLikes").innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
  if(S.tab!=="me") return;
  const L = S.me.likes;
  const badge = {done:["done","영상으로 나옴"], today:["today","오늘 공개"], making:["making","제작 중"], open:["open","투표 중"]};
  $("#myLikes").innerHTML = L.length ? `<div class="card" style="overflow:hidden">${L.map(x=>{ const [cls,lbl]=badge[x.status]||badge.open;
    const right = x.status==="done" ? `<a class="rt link" href="${esc(x.link||REELS)}" target="_blank" rel="noopener">보러 가기</a>` : x.status==="open" && x.rank ? `<span class="rt">${x.rank}위</span>` : "";
    return `<div class="mi"><div class="tp"><span class="badge ${cls}">${lbl}</span>${right}</div><div class="tt">${esc(itemTitle(x))}</div>
      <div class="ct"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 19 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z" fill="#ff3b5c"/></svg>누적 ${x.n}번${x.today?" · 오늘 보냄":""}</div></div>`; }).join("")}</div>`
    : `<div class="card"><p class="empty">아직 하트를 누른 게 없어요.<br>투표 탭에서 보고 싶은 편에 하트를 눌러 보세요!</p></div>`;
  const P = $("#myPosts");
  if(P){
    $("#myN").textContent = S.me.posts.length+"개";
    P.innerHTML = S.me.posts.length ? S.me.posts.map(p=>`<div class="mypost"><div class="to">${p.cat==="ask"?`${p.to}에게 질문 · 답글 ${p.replies||0}`:p.cat==="trait"?`${p.to} 특징`:`${p.to}에게`}</div><p>${esc(p.text)}</p>
      <div class="ft"><span><b style="color:var(--red)">♥ ${fmt(p.hearts)}</b> · ${ago(p.at)}</span><button data-del="${p.id}">지우기</button></div></div>`).join("")
      : `<div class="card"><p class="empty">아직 쓴 글이 없어요</p></div>`;
    $$("#myPosts [data-del]").forEach(b=>b.onclick=()=>{ if(confirm("내 한마디를 지울까요?")) postAct(Number(b.dataset.del),"delete"); });
  }
}
const OST = {paid:"접수", script:"대본 확인", making:"제작 중", done:"완성", canceled:"취소됨"};
function dueLabel(day){ if(!day) return ""; const d=new Date(day+"T00:00:00+09:00"); return `${d.getMonth()+1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]})`; }
async function loadOrders(){
  let d; try{ d = await api("orders/mine?voter="+V); }catch(e){ return; }
  const w=$("#myOrdersWrap"), box=$("#myOrders"); if(!w||!box) return;
  if(!d.orders.length){ w.hidden=true; return; }
  w.hidden=false;
  box.innerHTML = d.orders.map(o=>{
    const steps = ["paid","making","done"];
    const ci = steps.indexOf(o.status);
    const track = o.status==="canceled" ? "" : `<div class="otrack">${steps.map((k,i)=>`<div class="${i<ci?"dn":i===ci?"cu":""}"><i></i>${OST[k]}</div>`).join("")}</div>`;
    return `<div class="ocard"><div class="oh"><span class="badge o-${o.status}">${OST[o.status]||o.status}</span><span class="oid">${esc(o.id)}</span></div>
      <div class="ot">${esc(o.nameA)} ${o.a} × ${esc(o.nameB)} ${o.b} · ${esc(o.rel)}</div>
      <div class="os">${esc(o.product)} · ${Number(o.amount).toLocaleString()}원${o.status!=="canceled"&&o.status!=="done"&&o.due?` · ${dueLabel(o.due)}까지`:""}</div>${track}
      ${o.status==="script"&&o.script?`<div class="scr">대본 미리보기가 도착했어요 · <a href="${esc(o.script)}" target="_blank" rel="noopener">대본 보기</a><br><span style="font-weight:600;font-size:12px">수정할 곳은 메일로 답장해 주세요 (1회)</span></div>`:""}
      ${o.status==="done"&&o.link?`<a class="dl" href="${esc(o.link)}" target="_blank" rel="noopener">완성 영상 받기</a>`:""}
      ${o.status==="paid"?`<div class="of"><span>제작 시작 전까지 취소할 수 있어요</span><button data-ocancel="${esc(o.id)}">주문 취소</button></div>`:""}</div>`;
  }).join("");
  $$("#myOrders [data-ocancel]").forEach(b=>b.onclick=async()=>{
    if(!confirm("주문을 취소하고 전액 환불받을까요?")) return;
    b.disabled=true;
    try{ await api("order/"+encodeURIComponent(b.dataset.ocancel)+"/cancel", {}); toast("주문을 취소했어요. 환불은 카드사에 따라 3~7일 걸려요"); loadOrders(); }
    catch(e){ toast(e.message); b.disabled=false; }
  });
}
async function logout(){
  try{ await api("auth/logout", {}); }catch{}
  S.town=null; S.me=null; toast("로그아웃했어요"); await loadTown(); render();
}

// ================= 로그인 · 주민 등록 =================
function openSheet(html){ $("#sheet").innerHTML = `<div class="grab"></div>`+html; $("#dim").classList.add("show"); }
function closeSheet(){ $("#dim").classList.remove("show"); }
function typePick(title, cb){
  openSheet(`<h2 style="margin-top:14px;font-size:20px">${esc(title)}</h2>
    ${["NT","NF","SJ","SP"].map(k=>`<div class="glabel">${G[k].name} ${k}</div><div class="tgrid">${TYPES.filter(t=>grp(t)===k).map(t=>`<button data-tp="${t}" style="background:${G[k].c}">${t}</button>`).join("")}</div>`).join("")}
    <button class="later" id="tpClose" style="margin-top:14px">닫기</button>`);
  $$("#sheet [data-tp]").forEach(b=>b.onclick=()=>{ closeSheet(); cb(b.dataset.tp); });
  $("#tpClose").onclick = closeSheet;
}
$("#dim").onclick = (e)=>{ if(e.target.id==="dim") closeSheet(); };
function startJoin(){
  if(!S.town){ loadTown().then(startJoin); return; }
  if(S.town.me){ openSetup({changeOnly:true}); return; }
  if(S.town.kakao && !S.town.loggedIn){
    openSheet(`<div style="margin-top:18px;text-align:center"><span class="tag">주민 전용</span></div>
      <h2>참여하려면 3초 로그인</h2>
      <p class="d">주민 등록·한마디는 주민만 할 수 있어요.<br>투표 하트와 둘러보기는 로그인 없이 계속돼요.</p>
      <button class="kakao" id="kgo">${KAKAO}카카오 로그인</button>
      <button class="later" id="klater">나중에 할게요</button>
      <p class="fine">게시판엔 닉네임만 보여요. 카카오 프로필은 공개되지 않아요.</p>`);
    $("#kgo").onclick = ()=>{ location.href = "/api/auth/kakao?voter="+V; };
    $("#klater").onclick = closeSheet;
    return;
  }
  openSetup({});
}
const ADJ = ["눕고싶은","산책하는","새벽감성","야식먹는","계획없는","노래하는","고민많은","햇살같은","출근싫은","멍때리는"];
const rollNick = (t)=>`${ADJ[Math.floor(Math.random()*ADJ.length)]} ${t} ${10+Math.floor(Math.random()*90)}`;
async function suggestNick(t){ try{ return (await api("town/nick/suggest?type="+t)).nick; }catch{ return rollNick(t); } }
function openSetup({changeOnly}){
  const st = { type: S.town?.me?.type || "INFP", nick: S.town?.me?.nick || null, nickTouched: !!S.town?.me };
  if(!st.nick){ st.nick = rollNick(st.type); suggestNick(st.type).then(n=>{ if(!st.nickTouched){ st.nick=n; const i=$("#suNick"); if(i) i.value=n; } }); }
  const el = $("#setup");
  const draw = ()=>{
    el.innerHTML = `<div class="in"><header class="hd" style="padding-top:calc(12px + env(safe-area-inset-top))">
      <button class="back" id="suBack">‹ 닫기</button>
      <div style="margin-top:10px"><span class="tag">${changeOnly?"내 유형 바꾸기":"주민 등록 마지막 단계"}</span></div>
      <div class="out" style="margin-top:10px;font-size:30px">어느 동네<br>주민이세요?</div></header>
      <div class="pad">
        ${changeOnly ? "" : `<div style="font-size:14px;font-weight:800;margin-bottom:8px">닉네임</div>
        <div class="row"><input class="inp" id="suNick" maxlength="16" value="${esc(st.nick)}" style="height:52px;border-radius:14px;background:#fff;font-weight:700"><button id="suRoll" style="height:52px;padding:0 14px;border-radius:14px;border:2px solid var(--ink);background:var(--yellow);font-size:13px;font-weight:800;flex:none">다시 뽑기</button></div>
        <p class="muted" style="margin:8px 0 0">자동으로 만들었어요. 직접 바꿔도 되고, 나중에 내 정보에서 바꿀 수 있어요.</p>`}
        <div style="font-size:14px;font-weight:800;margin:${changeOnly?"0":"24px"} 0 4px">내 MBTI</div>
        ${["NT","NF","SJ","SP"].map(k=>`<div class="glabel">${G[k].name} ${k}</div><div class="tgrid">${TYPES.filter(t=>grp(t)===k).map(t=>`<button data-t="${t}" class="${t===st.type?"on":""}" style="${t===st.type?`background:${G[k].c};color:${G[k].ink}`:""}">${t}</button>`).join("")}</div>`).join("")}
      </div></div>
      <div class="foot"><button class="btn shadow" id="suGo">${st.type} 주민으로 ${changeOnly?"바꾸기":"등록하기"}</button></div>`;
    $("#suBack").onclick = ()=>closeSetup();
    $$("#setup .tgrid button").forEach(b=>b.onclick=()=>{
      const old = st.type; st.type = b.dataset.t;
      const n=$("#suNick"); if(n) st.nick = n.value;
      if(!st.nickTouched && !changeOnly){ st.nick = st.nick.replace(old, st.type); suggestNick(st.type).then(x=>{ if(!st.nickTouched){ st.nick=x; const i=$("#suNick"); if(i) i.value=x; } }); }
      draw();
    });
    const n=$("#suNick"); if(n) n.oninput=(e)=>{ st.nick=e.target.value; st.nickTouched=true; };
    const r=$("#suRoll"); if(r) r.onclick=async()=>{ st.nick = await suggestNick(st.type); st.nickTouched=false; const i=$("#suNick"); if(i) i.value=st.nick; };
    $("#suGo").onclick = async ()=>{
      $("#suGo").disabled = true;
      try{
        const body = {type: st.type}; if(!changeOnly) body.nick = st.nick.trim();
        const res = await api("town/join", body);
        toast(changeOnly ? (res.changed?`${st.type}(으)로 바꿨어요`:"그대로예요") : `${st.type} 주민이 됐어요! 응원도 눌러 주세요`);
        closeSetup();
        S.town=null; S.me=null; recent=null; S.board.type = S.board.type || st.type;
        await loadTown(); if(!changeOnly && S.tab!=="board") S.tab="town";
        setTab(S.tab);
      }catch(e){ toast(e.message); $("#suGo").disabled=false; if(e.status===401) { closeSetup(); S.town=null; await loadTown(); startJoin(); } }
    };
  };
  draw(); el.hidden=false; document.body.classList.add("in-setup"); window.scrollTo(0,0);
}
function closeSetup(){ $("#setup").hidden=true; document.body.classList.remove("in-setup"); window.scrollTo(0,0); }
function editNick(){
  const me = S.town.me;
  openSheet(`<h2 style="margin-top:18px">닉네임 바꾸기</h2><p class="d">게시판에 이 이름으로 보여요 (2~16자)</p>
    <input class="inp" id="nkIn" maxlength="16" value="${esc(me.nick)}" style="margin-top:18px;height:52px;font-weight:700">
    <div class="row" style="margin-top:10px"><button class="btn sm" id="nkRoll" style="background:#fff">다시 뽑기</button><button class="btn sm" id="nkGo">저장</button></div>`);
  $("#nkRoll").onclick=async()=>{ $("#nkIn").value = await suggestNick(me.type); };
  $("#nkGo").onclick=async()=>{
    try{ await api("town/nick", {nick: $("#nkIn").value.trim()}); toast("닉네임을 바꿨어요"); closeSheet(); S.town=null; S.me=null; recent=null; await loadTown(); render(); }
    catch(e){ toast(e.message); }
  };
}
function openMenu(){
  const me = S.town.me;
  const w = $("#menuWrap");
  w.innerHTML = `<div class="mdim" id="mdim"></div><div class="menu">
    <div style="display:flex;align-items:center;gap:8px"><span style="font-size:15px;font-weight:800">${esc(me.nick)}</span>${tb(me.type)}</div>
    <div class="muted" style="margin-top:4px">${S.town.loggedIn?"카카오 로그인":"이 기기로 등록"}${me.since?` · ${new Date(me.since).getFullYear()}.${new Date(me.since).getMonth()+1} 주민 등록`:""}</div>
    <div style="height:1.5px;background:var(--line);margin:12px 0 4px"></div>
    <button class="mrow" data-m="nick"><span>닉네임 바꾸기</span><span>›</span></button>
    <button class="mrow" data-m="type"><span>MBTI 바꾸기</span><span>${me.type} ›</span></button>
    <button class="mrow" data-m="me"><span>내 정보 · 내가 쓴 글</span><span>›</span></button>
    ${S.town.loggedIn?`<button class="mrow" data-m="out" style="font-size:13px;color:var(--mute)"><span>로그아웃</span><span></span></button>`:""}</div>`;
  const close = ()=>{ w.innerHTML=""; };
  $("#mdim").onclick = close;
  $$(".menu [data-m]").forEach(b=>b.onclick=()=>{ close(); const m=b.dataset.m;
    if(m==="nick") editNick(); else if(m==="type") openSetup({changeOnly:true}); else if(m==="me") setTab("me"); else logout(); });
}

window.addEventListener("hashchange", ()=>{
  const h = location.hash.replace("#","").split("?")[0];
  if(h==="pair"||h==="sit"){ if(S.tab!=="vote"||S.vtab!==h){ S.vtab=h; setTab("vote"); } }
  else if(["town","board","me"].includes(h)){ if(S.tab!==h) setTab(h); }
  else if(h===""||h==="vote"){ if(S.tab!=="vote"||S.vtab!=="mbti"){ S.vtab="mbti"; setTab("vote"); } }
});

// ================= 시작 =================
api("visit", {}).catch(()=>{});
(async ()=>{
  const h = location.hash.replace("#","").split("?")[0];
  if(location.hash.includes("login=fail")) setTimeout(()=>toast("로그인이 안 됐어요. 다시 시도해 주세요"), 300);
  if(h==="pair"||h==="sit"){ S.tab="vote"; S.vtab=h; }
  else if(["town","board","me"].includes(h)) S.tab=h;
  await loadTown();
  setTab(S.tab);
  loadPicked();
  // 카카오 로그인 직후 아직 주민이 아니면 바로 등록 화면
  if(S.town?.loggedIn && !S.town?.me && h==="town") openSetup({});
})();
</script>
