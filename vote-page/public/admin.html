<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>신청소 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f1ff;color:#2b2440;font-family:Pretendard,system-ui,sans-serif;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 14px}
h2{font-size:16px;margin:22px 0 8px}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 3px 0 #e3d9fb}
input,select,button{font:inherit;font-size:15px}
input,select{border:2px solid #e7e0f5;border-radius:10px;padding:8px 10px;background:#fff;color:inherit;min-width:0}
button{border:2px solid #2b2440;background:#fff;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer}
.ok{background:#bfeedd}.no{background:#ffd6d6}.pri{background:#b9a6ff}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.txt{font-weight:800}
.sub{color:#7a7290;font-size:12px;margin-top:2px}
.mb{display:grid;grid-template-columns:52px 1fr 54px;gap:6px;align-items:center;margin-bottom:6px}
.mb b{font-weight:900}
.mb .lk{grid-column:2/4}
.tabs{display:flex;gap:6px}
.tabs button[aria-selected="true"]{background:#fff0a8}
.empty{color:#7a7290;padding:8px}
#login{max-width:320px;margin:80px auto;text-align:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2440;color:#fff;padding:10px 16px;border-radius:12px;display:none}
.badge{display:inline-block;background:#ff8fa3;color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
</style>
</head>
<body>
<div id="login">
  <h1>신청소 관리</h1>
  <form id="lf"><input id="pw" type="password" placeholder="관리자 비밀번호" style="width:100%"><br><br><button class="pri" style="width:100%">들어가기</button></form>
</div>

<div class="wrap" id="app" hidden>
  <h1>신청소 관리 <a href="/" style="font-size:13px">페이지 보기 →</a></h1>
  <div class="tabs">
    <button data-t="pending" aria-selected="true">대기 중<span id="pc"></span></button>
    <button data-t="live">공개 아이디어</button>
    <button data-t="mbti">MBTI</button>
  </div>

  <section id="s-pending"><h2>승인 대기</h2><div id="pending"></div></section>

  <section id="s-live" hidden>
    <h2>직접 추가 (바로 공개)</h2>
    <div class="card"><form id="addf" class="row" style="margin:0">
      <input id="add-text" placeholder="만약 온 세상이 ○○라면?" style="flex:1" maxlength="40">
      <button class="pri">추가</button></form></div>
    <h2>공개 중</h2><div id="live"></div>
    <h2>거절함</h2><div id="rejected"></div>
  </section>

  <section id="s-mbti" hidden>
    <h2>MBTI 상태</h2>
    <p class="sub">나옴 = 투표 막히고 '나온 편'에 표시 · 제작 중 = 투표는 되고 배지 표시</p>
    <div class="card" id="mbti"></div>
  </section>
</div>
<div id="toast"></div>

<script>
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAGES=["접수","제작 중","공개 예정","나옴"];
let key=""; try{ key=sessionStorage.getItem("wf_admin")||""; }catch{}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1800);}
async function api(path,body){
  const r=await fetch("/api/"+path,{method:body?"POST":"GET",headers:{"content-type":"application/json","x-admin-key":key},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"오류"); return d;
}
async function login(){
  try{ await api("admin/check"); try{sessionStorage.setItem("wf_admin",key);}catch{} $("#login").hidden=true; $("#app").hidden=false; load(); }
  catch(e){ if(key) toast(e.message); }
}
$("#lf").onsubmit=(e)=>{e.preventDefault(); key=$("#pw").value; login();};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["pending","live","mbti"].forEach(t=>$("#s-"+t).hidden=t!==b.dataset.t);
});

async function load(){ await Promise.all([loadIdeas(), loadMbti()]); }
async function loadIdeas(){
  const {ideas}=await api("admin/ideas");
  const p=ideas.filter(i=>i.approved===0), l=ideas.filter(i=>i.approved===1), r=ideas.filter(i=>i.approved===-1);
  $("#pc").innerHTML=p.length?`<span class="badge">${p.length}</span>`:"";
  const when=(t)=>t?new Date(t).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
  $("#pending").innerHTML=p.length?p.map(i=>`<div class="card"><div class="txt">${esc(i.text)}</div>
    <div class="sub">${i.author?"@"+esc(i.author)+" · ":""}${when(i.created_at)}</div>
    <div class="row"><button class="ok" data-a="approve" data-id="${i.id}">승인</button><button class="no" data-a="reject" data-id="${i.id}">거절</button>
    <button data-a="edit" data-id="${i.id}">고쳐서 승인</button></div></div>`).join(""):`<p class="empty">대기 중인 아이디어가 없어요</p>`;
  $("#live").innerHTML=l.length?l.map(i=>`<div class="card"><div class="txt">${esc(i.text)} <span class="sub">❤️ ${i.hearts}</span></div>
    <div class="sub">${i.author?"@"+esc(i.author):""}</div>
    <div class="row"><select data-stage="${i.id}">${STAGES.map(s=>`<option ${s===i.stage?"selected":""}>${s}</option>`).join("")}</select>
    <input data-link="${i.id}" placeholder="릴스 링크" value="${esc(i.link||"")}" style="flex:1">
    <button data-a="save" data-id="${i.id}">저장</button><button class="no" data-a="hide" data-id="${i.id}">숨김</button></div></div>`).join(""):`<p class="empty">없어요</p>`;
  $("#rejected").innerHTML=r.length?r.map(i=>`<div class="card"><div class="txt">${esc(i.text)}</div>
    <div class="row"><button class="ok" data-a="approve" data-id="${i.id}">다시 승인</button><button class="no" data-a="del" data-id="${i.id}">완전 삭제</button></div></div>`).join(""):`<p class="empty">없어요</p>`;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,Number(b.dataset.id)));
}
async function act(a,id){
  try{
    if(a==="approve") await api("admin/ideas/update",{id,approved:1});
    if(a==="reject"||a==="hide") await api("admin/ideas/update",{id,approved:-1});
    if(a==="del"){ if(!confirm("완전히 삭제할까요?")) return; await api("admin/ideas/update",{id,delete:true}); }
    if(a==="edit"){ const t=prompt("고친 문장 (40자까지)"); if(!t) return; await api("admin/ideas/update",{id,text:t,approved:1}); }
    if(a==="save") await api("admin/ideas/update",{id,stage:$(`[data-stage="${id}"]`).value,link:$(`[data-link="${id}"]`).value});
    toast("완료"); loadIdeas();
  }catch(e){ toast(e.message); }
}
$("#addf").onsubmit=async(e)=>{e.preventDefault(); const t=$("#add-text").value.trim(); if(!t) return;
  try{ await api("admin/ideas/add",{text:t}); $("#add-text").value=""; toast("추가했어요"); loadIdeas(); }catch(er){ toast(er.message); } };

async function loadMbti(){
  const {types}=await api("mbti");
  $("#mbti").innerHTML=types.map(t=>`<div class="mb"><b>${t.type}</b>
    <select data-ms="${t.type}"><option value="open" ${t.status==="open"?"selected":""}>신청 받는 중 (${t.votes}표)</option>
    <option value="making" ${t.status==="making"?"selected":""}>제작 중</option><option value="done" ${t.status==="done"?"selected":""}>나옴</option></select>
    <input data-me="${t.type}" placeholder="편" inputmode="numeric" value="${t.episode||""}">
    <input class="lk" data-ml="${t.type}" placeholder="릴스 링크 (선택)" value="${esc(t.link||"")}"></div>`).join("")+`<button class="pri" id="msave" style="width:100%;margin-top:6px">MBTI 상태 저장</button>`;
  $("#msave").onclick=async()=>{
    try{
      for(const t of types){
        const status=$(`[data-ms="${t.type}"]`).value, episode=$(`[data-me="${t.type}"]`).value, link=$(`[data-ml="${t.type}"]`).value;
        if(status!==t.status||String(episode)!==String(t.episode||"")||link!==(t.link||""))
          await api("admin/mbti",{type:t.type,status,episode,link});
      }
      toast("저장했어요"); loadMbti();
    }catch(e){ toast(e.message); }
  };
}
if(key) login();
</script>
</body>
</html>
