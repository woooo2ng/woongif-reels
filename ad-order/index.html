<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { person } from './char3d.js';
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true,preserveDrawingBuffer:true});

const bgEl=document.getElementById('bg'),ui=document.getElementById('ui');
const FONT='"Noto Sans CJK KR"';
const clamp01=x=>Math.max(0,Math.min(1,x));

const texCache={};
function bubbleTex(text,bg,fg,fs){
  const key=text+bg+fg+fs; if(texCache[key])return texCache[key];

function textSprite(text,fs,col,size){const c=document.createElement('canvas'),ctx=c.getContext('2d');ctx.font=`900 ${fs}px ${FONT}`;const w=ctx.measureText(text).width+20;c.width=w;c.height=fs*1.4;ctx.font=`900 ${fs}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=fs*0.12;ctx.strokeStyle='rgba(40,40,60,0.9)';ctx.strokeText(text,w/2,c.height/2);ctx.fillText(text,w/2,c.height/2);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(w*size,c.height*size,1);s.userData.base=[w*size,c.height*size];return s}
function windowTexture(cols,rows,wall,win,lit,r){
  const c=document.createElement('canvas');c.width=cols*32;c.height=rows*40;const x=c.getContext('2d');

}
const WALLS=['#c9b8c9','#b9c4d6','#d3c2b2','#aebccc','#c8b4a4','#bfcabf'];
function makeBuilding(r,w,h,d){
  const wall=WALLS[Math.floor(r()*WALLS.length)];const rows=Math.max(2,Math.round(h/1.4));
  const side=new THREE.MeshLambertMaterial({map:windowTexture(Math.max(2,Math.round(w/1.1)),rows,wall,'#5d6f8a',0.35,r)});

  const top=new THREE.MeshLambertMaterial({color:new THREE.Color(wall).multiplyScalar(0.8)});

}
// ---------- 등장인물: 주문서에서 꾸민 그대로 (선우 INTJ 여 · 웅이 ISFP 남) ----------
const SUNWOO={g:'여',hair:'long',hc:0,skin:0,cl:0,gl:true,top:'tee',bottom:'skirt',bc:4,hat:'none',scarf:false};

function umbrella(col=0xff8fb3){

  const can=new THREE.Mesh(new THREE.ConeGeometry(0.95,0.42,10,1,true),new THREE.MeshLambertMaterial({color:col,flatShading:true,side:THREE.DoubleSide}));can.position.y=0.21;g.add(can);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(0.04,8,6),lamb(0x333333));tip.position.y=0.44;g.add(tip);
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,1.05,6),lamb(0x444444));sh.position.y=-0.3;g.add(sh);
  const hd=new THREE.Mesh(new THREE.TorusGeometry(0.06,0.02,6,10,Math.PI),lamb(0x6a4a3a));hd.position.y=-0.83;hd.rotation.z=Math.PI;g.add(hd);
  return g;
}
function alley(scene,r,o={}){
  const g=new THREE.Mesh(new THREE.PlaneGeometry(120,120),lamb(o.ground??0x8e98a8));g.rotation.x=-Math.PI/2;g.position.y=-0.01;scene.add(g);
  for(const s of[-1,1]){let z=6;while(z>-60){const w=3+r()*2.5,h=5+r()*9,d=4;const b=makeBuilding(r,d,h,w);b.position.set(s*(3.6+d/2),b.position.y,z-w/2);scene.add(b);z-=w+0.3}}

  for(const [x,z] of [[-2.6,-3],[2.6,-9]]){const p=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,3.2,6),lamb(0x3a3f4a));p.position.set(x,1.6,z);scene.add(p);
    const l=new THREE.Mesh(new THREE.SphereGeometry(0.18,10,8),basic(0xfff1b8));l.position.set(x,3.25,z);scene.add(l)}

  for(const [x,z,s] of [[0.9,1.2,0.7],[-1.2,-1.5,0.9],[1.5,-4,0.6]]){const pd=new THREE.Mesh(new THREE.CircleGeometry(s,20),new THREE.MeshLambertMaterial({color:0xaab8cc,transparent:true,opacity:0.75}));pd.rotation.x=-Math.PI/2;pd.position.set(x,0.005,z);pd.scale.y=0.6;scene.add(pd)}

function rain(scene,n,r,area){

const LIGHT=(scene)=>{scene.add(new THREE.HemisphereLight(0xdfe8ff,0x6a7080,1.5));const d=new THREE.DirectionalLight(0xffffff,1.3);d.position.set(4,10,8);scene.add(d);scene.add(new THREE.AmbientLight(0xffffff,0.2))};

const CAPS={0:["웅이프한테 우리 커플 영상을","주문하면 생기는 일."],1:["먼저, 두 사람 MBTI를 고르고."],2:["캐릭터를 직접 꾸며요.","머리도, 안경도, 옷도요."],3:["그리고 우리만 아는","이야기를 적으면,"],4:["그 이야기가,","진짜 우리 영상이 돼요."],5:["오픈 기념, 선착순 10명 할인!","여러분 커플은 무슨 MBTI인가요?"]};
let LEAD=0.25,VOICE=[];
window.setTiming=(lead,voice)=>{LEAD=lead;VOICE=voice};
function caption(si,t){

const S=[];
// ---------- 0: 후킹 — 비 오는 골목, 우산 하나 같이 쓴 선우·웅이 ----------
S[0]=()=>{
  bgEl.style.background='linear-gradient(#5f7398,#9fb2cf 55%,#c9d5e6)';

  const um=umbrella();um.position.set(0.05,2.35,0.05);um.rotation.z=0.16;scene.add(um);

    t2.style.transform=`scale(${pop((t-0.35)/0.4)})`;t2.style.opacity=clamp01((t-0.35)/0.1);

  };
};
// ---------- 1~3: 주문 페이지 실제 화면 ----------
const STEP={1:['STEP 1','MBTI 고르기'],2:['STEP 2','캐릭터 꾸미기'],3:['STEP 3','우리 이야기 쓰기']};
const PH={};

S[1]=phoneScene(1);S[2]=phoneScene(2);S[3]=phoneScene(3);
// ---------- 4: 사연이 3D로 — 처음 만난 날, 비 → 웅이가 우산을 씌워 줌 ----------
